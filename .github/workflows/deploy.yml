# Deploys the backend to AWS App Runner on merges to main.
# Frontend deploys separately via Amplify Hosting (repo-connected, auto-deploys).
#
# Prerequisites (docs/deployment-aws.md):
#   - GitHub OIDC provider + role `agile-tracker-github-deploy` (trust scoped to
#     repo:salesmayn-code/AgileCapacityTracker:environment:deploy)
#   - ECR repository `agile-tracker-backend`
#   - App Runner service `agile-tracker-backend` (ECR-based, VPC-connected to RDS)
#   - Repo variables: AWS_REGION, AWS_ACCOUNT_ID, APPRUNNER_SERVICE_ARN
#   - GitHub environment: deploy
#
# The gate at the top keeps this a no-op until the AWS side is provisioned:
# adding the three repo variables is what arms the pipeline.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Backend → ECR → App Runner
    runs-on: ubuntu-latest
    # GitHub environment for deploy authority (add required reviewers in Phase 12)
    environment: deploy
    # No-op until AWS vars exist; remove the gate check when provisioning is done
    if: ${{ vars.AWS_REGION != '' && vars.AWS_ACCOUNT_ID != '' && vars.APPRUNNER_SERVICE_ARN != '' }}
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/agile-tracker-github-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: agile-tracker-backend
        run: |
          IMAGE=${REGISTRY}/${REPO}:${GITHUB_SHA::12}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Trigger App Runner deployment
        # UpdateService with the new image digest; App Runner handles the rest
        # (health-checked rolling deploy, auto-rollback on failed health check)
        env:
          SERVICE_ARN: ${{ vars.APPRUNNER_SERVICE_ARN }}
        run: |
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration '{"ImageRepository":{"RepositoryUri":"'"${IMAGE%:*}"'","ImageIdentifier":"'"${IMAGE##*:}"'","ImageRepositoryType":"ECR"}}'
          echo "Deployment triggered for $IMAGE"

      - name: Wait for deployment to complete
        env:
          SERVICE_ARN: ${{ vars.APPRUNNER_SERVICE_ARN }}
        run: |
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            status=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' --output text)
            op=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" \
              --query 'Service.OperationsSummary[0].Status' --output text 2>/dev/null || echo "")
            if [ "$status" = "RUNNING" ] && [ "$op" = "SUCCEEDED" ]; then
              echo "Deployment succeeded"
              exit 0
            fi
            if [ "$op" = "FAILED" ]; then
              echo "Deployment FAILED - check App Runner console for logs"
              exit 1
            fi
            echo "status=$status op=$op - waiting..."
            sleep 30
          done
          echo "Timed out waiting for deployment"
          exit 1
