spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Tests run the real Flyway migrations (V1 + V2 + V3) - proves schema/entity parity every run
spring.flyway.enabled=true
# Test-only HS256 secret (32+ chars) - never a production secret
app.jwt.secret=test-jwt-secret-0123456789abcdef-0123
app.auth.bootstrap-admin.email=admin@test.local
app.auth.bootstrap-admin.password=test-admin-password
# no github.api.token: proves the app boots without it and sync fails fast (400) offline

# Actuator: match main exposure (health/info/metrics + probes) so the integration
# test proves the same contract the container health check relies on
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Rate limits raised for the shared test context (many logins per run);
# the RateLimitFilterTest unit test exercises the real window logic directly
app.ratelimit.login-per-minute=1000
app.ratelimit.sync-per-minute=1000
