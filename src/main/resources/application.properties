# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agile_capacity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Flyway schema migrations (V1 baseline, V2 audit fields)
spring.flyway.enabled=true

# GitHub API (optional at boot; sync requires it or a per-request token)
github.api.token=${GITHUB_API_TOKEN:}

# CORS (comma-separated list of allowed origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth (required: 32+ char HS256 secret)
app.jwt.secret=${JWT_SECRET}
app.auth.bootstrap-admin.email=${ADMIN_EMAIL:}
app.auth.bootstrap-admin.password=${ADMIN_PASSWORD:}

# Actuator: health/info/metrics - used by Docker/App Runner health checks;
# metrics exposes framework counters only (Phase 11)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
